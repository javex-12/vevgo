<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vevgo Grocery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4faf1;--sf:#fff;--sc:#e8f1e5;--sch:#dce8d9;--on:#171d18;--on2:#434b44;--pri:#006d3b;--onpri:#fff;--pc:#9df7b6;--onpc:#00210f;--ol:#c3cbc1;--err:#ba1a1a;--ec:#ffdad6;--t1:#c8f2d4;--t2:#ffe3b8;--t3:#cfe4ff;--t4:#ffd9e2;--sh:0 6px 24px rgba(0,40,20,.10);--sp:cubic-bezier(.34,1.56,.64,1)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f140f;--sf:#171d17;--sc:#1d241d;--sch:#283128;--on:#e0e5dc;--on2:#c1c9bf;--pri:#82daa0;--onpri:#00391c;--pc:#00522b;--onpc:#9df7b6;--ol:#414942;--err:#ffb4ab;--ec:#93000a;--t1:#1f4a31;--t2:#5a4217;--t3:#1e3f63;--t4:#5c2438;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f140f;--sf:#171d17;--sc:#1d241d;--sch:#283128;--on:#e0e5dc;--on2:#c1c9bf;--pri:#82daa0;--onpri:#00391c;--pc:#00522b;--onpc:#9df7b6;--ol:#414942;--err:#ffb4ab;--ec:#93000a;--t1:#1f4a31;--t2:#5a4217;--t3:#1e3f63;--t4:#5c2438;--sh:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--on);font:500 16px/1.4 'Plus Jakarta Sans',system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:0 16px 150px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo i{width:32px;height:32px;border-radius:12px 12px 12px 4px;background:var(--pri);display:grid;place-items:center}
.logo svg{width:18px;fill:none;stroke:var(--onpri);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:34px;line-height:1.08;letter-spacing:-1px;font-weight:800}
h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--on2);font-size:15px}
.hero{background:var(--pc);color:var(--onpc);border-radius:40px 40px 40px 14px;padding:28px 24px;margin:4px 0 20px;position:relative;overflow:hidden}
.hero h1{max-width:75%}
.hero p{margin-top:10px;max-width:70%;font-size:15px}
.hero b{position:absolute;right:-8px;bottom:-14px;font-size:104px;line-height:1;transform:rotate(-12deg);transition:transform .5s var(--sp)}
.hero:active b{transform:rotate(8deg) scale(1.1)}
.search{display:flex;align-items:center;gap:10px;background:var(--sc);border-radius:28px;padding:0 20px;height:56px;margin-bottom:14px;transition:border-radius .3s var(--sp)}
.search:focus-within{border-radius:16px;box-shadow:inset 0 0 0 2px var(--pri)}
.search input{flex:1;border:0;background:none;outline:0;height:100%;min-width:0}
.search svg,.nav svg,.btn svg{width:24px;height:24px;fill:currentColor;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 14px;margin:0 -16px;scrollbar-width:none}
.chip{flex:none;height:40px;padding:0 18px;border-radius:20px;background:var(--sc);font-weight:700;font-size:14px;transition:all .35s var(--sp)}
.chip.on{background:var(--pri);color:var(--onpri);border-radius:12px}
.chip:active{transform:scale(.92)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--sf);border-radius:28px;padding:10px 10px 14px;box-shadow:var(--sh);display:flex;flex-direction:column}
.tile{aspect-ratio:1;display:grid;place-items:center;font-size:62px;border-radius:34px 18px 34px 18px;transition:border-radius .5s var(--sp),transform .5s var(--sp)}
.card:nth-child(even) .tile{border-radius:18px 34px 18px 34px}
.card:hover .tile{border-radius:50%;transform:rotate(-6deg)}
.t0{background:var(--t1)}.t1{background:var(--t2)}.t2{background:var(--t3)}.t3{background:var(--t4)}
.card h3{font-size:16px;font-weight:800;margin:12px 6px 0;line-height:1.2}
.card small{color:var(--on2);margin:2px 6px 0;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;margin:10px 6px 0;gap:6px}
.price{font-weight:800;font-size:16px}
.add{width:44px;height:44px;border-radius:16px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;transition:all .35s var(--sp)}
.add:active{transform:scale(.85);border-radius:50%}
.add svg{width:22px;height:22px;fill:currentColor}
.qty{display:flex;align-items:center;background:var(--pc);color:var(--onpc);border-radius:22px;height:44px;font-weight:800;animation:pop .4s var(--sp)}
.qty button{width:36px;height:44px;font-size:20px;font-weight:800}
.qty span{min-width:16px;text-align:center}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(488px,calc(100% - 32px));background:var(--sf);border-radius:32px;padding:8px;display:flex;gap:4px;box-shadow:0 8px 32px rgba(0,30,15,.22);z-index:5}
.nav button{flex:1;height:60px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--on2);position:relative;transition:all .4s var(--sp)}
.nav button.on{background:var(--pc);color:var(--onpc);flex:1.35;border-radius:20px}
.nav em{position:absolute;top:6px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--err);color:var(--bg);font:800 11px/18px 'Plus Jakarta Sans',sans-serif;font-style:normal;text-align:center;padding:0 4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(102px + env(safe-area-inset-bottom,0px));z-index:6;height:60px;padding:0 24px 0 20px;border-radius:22px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;gap:10px;font-weight:800;box-shadow:0 10px 28px rgba(0,60,30,.35);animation:pop .45s var(--sp);transition:transform .3s var(--sp)}
.fab:active{transform:translateX(-50%) scale(.94)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.stat{background:var(--sc);border-radius:22px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;color:var(--on2);font-weight:700}
.stat.hot{background:var(--pc);color:var(--onpc);border-radius:28px 12px 28px 12px}
.ord{background:var(--sf);border-radius:28px;padding:18px;box-shadow:var(--sh);margin-bottom:12px;animation:pop .45s var(--sp)}
.ord header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.oid{font:800 15px ui-monospace,monospace;letter-spacing:.3px}
.ago{font-size:13px;color:var(--on2)}
.badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:13px;font-weight:800;background:var(--sch)}
.s-new{background:var(--ec);color:var(--err)}.s-packing,.s-ready{background:var(--t2)}.s-assigned,.s-out{background:var(--t3)}.s-done{background:var(--pc);color:var(--onpc)}
.who{margin-top:10px;font-weight:700}
.meta{color:var(--on2);font-size:14px;margin-top:2px}
.items{margin-top:10px;padding:12px 14px;background:var(--sc);border-radius:18px;font-size:14px;display:grid;gap:4px}
.items div{display:flex;justify-content:space-between}
.btn{margin-top:14px;width:100%;height:52px;border-radius:26px;background:var(--pri);color:var(--onpri);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .35s var(--sp)}
.btn:active{transform:scale(.96);border-radius:16px}
.btn.soft{background:var(--pc);color:var(--onpc)}
.btn[disabled]{background:var(--sch);color:var(--on2);cursor:default}
.empty{text-align:center;padding:48px 24px;background:var(--sc);border-radius:40px 40px 40px 14px;margin-top:8px}
.empty b{font-size:56px;display:block;margin-bottom:8px}
.empty h2{margin-bottom:4px}
.secthead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}
.count{min-width:30px;height:30px;border-radius:15px;background:var(--sch);display:grid;place-items:center;font-weight:800;font-size:14px;padding:0 8px}
.rider{display:flex;align-items:center;gap:12px;margin-top:6px}
.av{width:48px;height:48px;border-radius:18px 18px 18px 6px;background:var(--pc);color:var(--onpc);display:grid;place-items:center;font-weight:800;font-size:20px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:36px 36px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));z-index:21;animation:up .5s var(--sp)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ol);margin:0 auto 14px}
.line{display:flex;align-items:center;gap:12px;padding:10px 0}
.line .tile{width:52px;aspect-ratio:1;font-size:28px;border-radius:18px;flex:none}
.line div{flex:1;min-width:0}
.line b{display:block}
.fld{display:block;margin-top:12px}
.fld span{font-size:13px;font-weight:700;color:var(--on2);margin-left:16px}
.fld input{width:100%;height:56px;border-radius:20px;border:2px solid transparent;background:var(--sc);padding:0 18px;outline:0;margin-top:4px;transition:all .3s var(--sp)}
.fld input:focus{border-color:var(--pri);border-radius:28px}
.fld.bad input{border-color:var(--err)}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:18px 0 4px}
.pay{display:flex;gap:8px;align-items:center;color:var(--on2);font-size:14px;margin-top:2px}
.snack{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--on);color:var(--bg);padding:14px 22px;border-radius:18px;font-weight:700;z-index:30;animation:pop .4s var(--sp);white-space:nowrap;max-width:92vw}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const P=[['tomatoes','Fresh tomatoes','1 kg',2500,'🍅','Vegetables'],['bananas','Cavendish bananas','Bunch of 6',1800,'🍌','Fruits'],['rice','Long grain rice','5 kg bag',12000,'🍚','Grains'],['milk','Whole milk','1 L',950,'🥛','Dairy'],['onions','Red onions','1 kg',1300,'🧅','Vegetables'],['avocados','Hass avocados','Pack of 3',3200,'🥑','Fruits'],['eggs','Farm eggs','Crate of 12',4200,'🥚','Dairy'],['bread','Sourdough loaf','600 g',2800,'🍞','Bakery'],['juice','Orange juice','1 L',1500,'🧃','Drinks'],['chicken','Chicken breast','1 kg',5500,'🍗','Meat'],['spinach','Fresh spinach','500 g',1100,'🥬','Vegetables'],['corn','Sweet corn','2 cobs',900,'🌽','Vegetables']].map((a,i)=>({id:a[0],name:a[1],unit:a[2],price:a[3],e:a[4],cat:a[5],c:i%4}));
const CATS=['All','Bakery','Dairy','Drinks','Fruits','Grains','Meat','Vegetables'];
const byId=Object.fromEntries(P.map(p=>[p.id,p]));
const RIDER='Tunde Okafor';
const now=Date.now();
const S={view:'shop',cat:'All',q:'',cart:{},sheet:false,filter:'all',err:{},f:{name:'',phone:'',addr:''},
orders:[{id:'ORD-JZ9A9N',name:'Michael Adeyemi',phone:'08012345678',addr:'12 Allen Avenue, Ikeja, Lagos',items:{rice:1,bananas:1,eggs:1},st:'assigned',rider:RIDER,t:now-34*60000},
{id:'ORD-8GHM2Z',name:'Michael Dosunmu',phone:'+2348085741430',addr:'7 Opeolu Street',items:{bananas:1,eggs:1},st:'out',rider:RIDER,t:now-4*60000}]};
const N=n=>'₦'+n.toLocaleString('en-NG');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tot=it=>Object.entries(it).reduce((s,[k,q])=>s+byId[k].price*q,0);
const cnt=it=>Object.values(it).reduce((s,q)=>s+q,0);
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-t)/60000));return m<60?m+' min ago':Math.round(m/60)+' hr ago'};
const LBL={new:'New',packing:'Packing',ready:'Ready for pickup',assigned:'Rider assigned',out:'On the way',done:'Delivered'};
const I={plus:'<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>',search:'<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>',bag:'<svg viewBox="0 0 24 24"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2m-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2m0 10c-2.76 0-5-2.24-5-5h2a3 3 0 0 0 6 0h2c0 2.76-2.24 5-5 5"/></svg>',list:'<svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2M10 17l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9z"/></svg>',ride:'<svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3a2 2 0 0 0-2 2v11h2a3 3 0 0 0 6 0h6a3 3 0 0 0 6 0h2v-5zM6 18.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m13.5-9 1.96 2.5H17v-2.5zM18 18.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/></svg>'};
const $=s=>document.querySelector(s);
let tm;const toast=m=>{clearTimeout(tm);document.querySelector('.snack')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="snack" role="status">${m}</div>`);tm=setTimeout(()=>document.querySelector('.snack')?.remove(),2400)};

function chrome(){
 const n=cnt(S.cart),ready=S.orders.filter(o=>o.st==='ready').length,neu=S.orders.filter(o=>o.st==='new').length;
 const nb=(v,ic,l,b)=>`<button data-go="${v}" class="${S.view===v?'on':''}" aria-label="${l}">${I[ic]}${l}${b?`<em>${b}</em>`:''}</button>`;
 return `<div class="top"><div class="logo"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l5 5L19.5 7"/></svg></i>Vevgo</div></div>
 <main id="main"></main>
 ${S.view==='shop'&&n?`<button class="fab" data-act="cart">${I.bag}${n} ${n>1?'items':'item'}<span>${N(tot(S.cart))}</span></button>`:''}
 <nav class="nav">${nb('shop','bag','Shop',0)}${nb('vendor','list','Vendor',neu)}${nb('rider','ride','Rider',ready)}</nav>`}

function shop(){return `<section class="hero"><h1>Groceries at your gate.</h1><p>Packed fast. Pay when it arrives.</p><b>🛵</b></section>
<label class="search">${I.search}<input id="q" type="search" placeholder="Search tomatoes, rice, milk" value="${esc(S.q)}" aria-label="Search groceries"></label>
<div class="chips">${CATS.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div><div id="grid" class="grid"></div>`}
function grid(){
 const l=P.filter(p=>(S.cat==='All'||p.cat===S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase()));
 $('#grid').innerHTML=l.length?l.map(p=>{const q=S.cart[p.id]||0;return `<article class="card"><div class="tile t${p.c}">${p.e}</div><h3>${p.name}</h3><small>${p.unit}</small><div class="row"><span class="price">${N(p.price)}</span>${q?`<div class="qty"><button data-dec="${p.id}" aria-label="Remove one">−</button><span>${q}</span><button data-inc="${p.id}" aria-label="Add one">+</button></div>`:`<button class="add" data-inc="${p.id}" aria-label="Add ${p.name}">${I.plus}</button>`}</div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1"><b>🔍</b><h2>Nothing matches</h2><p class="sub">Try another word or pick All.</p></div>`}

function orderCard(o,act){
 const it=Object.entries(o.items).map(([k,q])=>`<div><span>${byId[k].e} ${byId[k].name} × ${q}</span><b>${N(byId[k].price*q)}</b></div>`).join('');
 return `<article class="ord"><header><div><div class="oid">${o.id}</div><div class="ago">${ago(o.t)}</div></div><span class="badge s-${o.st}">${LBL[o.st]}</span></header>
 <div class="who">${esc(o.name)}</div><div class="meta">${esc(o.addr)}</div><div class="meta">${esc(o.phone)}</div>
 <div class="items">${it}<div style="border-top:1px solid var(--ol);padding-top:6px;margin-top:2px"><b>Total, pay on delivery</b><b>${N(tot(o.items))}</b></div></div>${act}</article>`}

function vendor(){
 const c=s=>S.orders.filter(o=>o.st===s).length;
 const F=[['all','All'],['new','New'],['packing','Packing'],['ready','Ready'],['out','On the way'],['done','Delivered']];
 const list=S.orders.filter(o=>S.filter==='all'||(S.filter==='out'?['assigned','out'].includes(o.st):o.st===S.filter));
 const act=o=>o.st==='new'?`<button class="btn" data-adv="${o.id}">Accept order</button>`:o.st==='packing'?`<button class="btn" data-adv="${o.id}">Mark as ready</button>`:o.st==='ready'?`<button class="btn" disabled>Waiting for a rider</button>`:o.rider&&o.st!=='done'?`<button class="btn soft" disabled>${o.rider} has it</button>`:'';
 return `<h1>Orders</h1><p class="sub" style="margin-top:6px">Accept, pack, then a rider picks up.</p>
 <div class="stats"><div class="stat ${c('new')?'hot':''}"><b>${c('new')}</b><span>New</span></div><div class="stat"><b>${c('packing')}</b><span>Packing</span></div><div class="stat"><b>${c('ready')}</b><span>Ready</span></div><div class="stat"><b>${S.orders.filter(o=>['assigned','out'].includes(o.st)).length}</b><span>Moving</span></div></div>
 <div class="chips">${F.map(f=>`<button class="chip ${S.filter===f[0]?'on':''}" data-fil="${f[0]}">${f[1]}</button>`).join('')}</div>
 ${list.length?list.map(o=>orderCard(o,act(o))).join(''):`<div class="empty"><b>🧺</b><h2>No orders here</h2><p class="sub">New orders show up the second someone checks out.</p></div>`}`}

function rider(){
 const rd=S.orders.filter(o=>o.st==='ready'),ac=S.orders.filter(o=>['assigned','out'].includes(o.st)&&o.rider===RIDER);
 return `<h1>Deliveries</h1><div class="rider"><div class="av">T</div><div><b>${RIDER}</b><div class="sub">On shift</div></div></div>
 <div class="secthead"><h2>Ready for pickup</h2><span class="count">${rd.length}</span></div>
 ${rd.length?rd.map(o=>orderCard(o,`<button class="btn" data-adv="${o.id}">Accept delivery</button>`)).join(''):`<div class="empty"><b>📦</b><h2>Nothing to pick up</h2><p class="sub">The next ready order appears here on its own.</p></div>`}
 <div class="secthead"><h2>On your route</h2><span class="count">${ac.length}</span></div>
 ${ac.length?ac.map(o=>orderCard(o,o.st==='assigned'?`<button class="btn soft" data-adv="${o.id}">Start delivery</button>`:`<button class="btn" data-adv="${o.id}">Mark delivered</button>`)).join(''):`<div class="empty"><b>🛵</b><h2>No active drops</h2><p class="sub">Accept a delivery above to get moving.</p></div>`}`}

function sheet(){
 const e=S.err,f=S.f,l=Object.entries(S.cart);
 const fl=(k,lb,t,ph)=>`<label class="fld ${e[k]?'bad':''}"><span>${lb}${e[k]?' · '+e[k]:''}</span><input data-f="${k}" type="${t}" placeholder="${ph}" value="${esc(f[k])}" autocomplete="off"></label>`;
 return `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-label="Your cart"><div class="grab"></div><h2>Your cart</h2>
 ${l.map(([k,q])=>{const p=byId[k];return `<div class="line"><div class="tile t${p.c}">${p.e}</div><div><b>${p.name}</b><span class="sub">${N(p.price)} each</span></div><div class="qty"><button data-dec="${k}" aria-label="Remove one">−</button><span>${q}</span><button data-inc="${k}" aria-label="Add one">+</button></div></div>`}).join('')}
 ${fl('name','Your name','text','Full name')}${fl('phone','Phone number','tel','080 1234 5678')}${fl('addr','Delivery address','text','Street, area, city')}
 <div class="total"><span>Total</span><span>${N(tot(S.cart))}</span></div><div class="pay">💵 Pay cash or transfer when your order arrives</div>
 <button class="btn" data-act="place">Place order</button></div>`}

function render(){
 const sc=window.scrollY;$('#app').innerHTML=chrome();
 $('#main').innerHTML=S.view==='shop'?shop():S.view==='vendor'?vendor():rider();
 if(S.view==='shop')grid();
 document.querySelector('.scrim,.sheet')?.remove();
 if(S.sheet&&cnt(S.cart))document.body.insertAdjacentHTML('beforeend',sheet());else S.sheet=false;
 window.scrollTo(0,sc)}
function renderSheet(){document.querySelectorAll('.scrim,.sheet').forEach(x=>x.remove());if(S.sheet&&cnt(S.cart))document.body.insertAdjacentHTML('beforeend',sheet())}
function refreshFab(){const old=$('.fab');const n=cnt(S.cart);if(old&&!n)old.remove();else if(old)old.innerHTML=`${I.bag}${n} ${n>1?'items':'item'}<span>${N(tot(S.cart))}</span>`;else if(n&&S.view==='shop')$('#app').insertAdjacentHTML('beforeend',`<button class="fab" data-act="cart">${I.bag}${n} ${n>1?'items':'item'}<span>${N(tot(S.cart))}</span></button>`)}

const NEXT={new:'packing',packing:'ready',ready:'assigned',assigned:'out',out:'done'};
const MSG={packing:'Order accepted',ready:'Marked as ready',assigned:'Delivery accepted',out:'Delivery started',done:'Marked as delivered'};
document.addEventListener('click',e=>{
 const t=e.target.closest('button,.scrim');if(!t)return;const d=t.dataset;
 if(d.go){S.view=d.go;S.sheet=false;window.scrollTo(0,0);render()}
 else if(d.cat){S.cat=d.cat;render()}
 else if(d.fil){S.filter=d.fil;render()}
 else if(d.inc||d.dec){const k=d.inc||d.dec;const q=(S.cart[k]||0)+(d.inc?1:-1);if(q>0)S.cart[k]=q;else delete S.cart[k];if(S.sheet){S.sheet=cnt(S.cart)>0;if(S.sheet){const y=$('.sheet').scrollTop;renderSheet();$('.sheet').style.animation='none';$('.sheet').scrollTop=y}else renderSheet()}else grid();refreshFab();if(S.sheet===false&&S.view==='shop')refreshFab()}
 else if(d.adv){const o=S.orders.find(o=>o.id===d.adv);o.st=NEXT[o.st];if(o.st==='assigned')o.rider=RIDER;toast(MSG[o.st]);render()}
 else if(d.act==='cart'){S.sheet=true;S.err={};renderSheet()}
 else if(d.act==='close'){S.sheet=false;renderSheet()}
 else if(d.act==='place'){
  const f=S.f,er={};if(f.name.trim().length<2)er.name='Add your name';if(f.phone.replace(/\D/g,'').length<10)er.phone='Check the number';if(f.addr.trim().length<6)er.addr='Add a full address';
  S.err=er;if(Object.keys(er).length){const y=$('.sheet').scrollTop;renderSheet();$('.sheet').style.animation='none';$('.sheet').scrollTop=y;return}
  const id='ORD-'+Math.random().toString(36).slice(2,8).toUpperCase();
  S.orders.unshift({id,name:f.name.trim(),phone:f.phone.trim(),addr:f.addr.trim(),items:{...S.cart},st:'new',t:Date.now()});
  S.cart={};S.sheet=false;render();toast('Order '+id+' placed')}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;grid()}else if(e.target.dataset.f){S.f[e.target.dataset.f]=e.target.value}});
render();
</script>
</body>
</html>
